<title>AZ-900 五天冲刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F6F8FA; --surface:#FFFFFF; --surface-2:#EFF3F7;
    --ink:#111721; --muted:#5D6876; --line:#E3E8EE; --line-strong:#CBD4DF;
    --accent:#0B5FCE; --accent-soft:#E7F0FD;
    --pass:#0E7A55; --pass-soft:#E3F4EC;
    --fail:#C33A30; --fail-soft:#FBEAE8;
    --warn:#A96A0C; --warn-soft:#FBF1DF;
    --sans:"Instrument Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0D1219; --surface:#151C25; --surface-2:#1C242F;
      --ink:#E6ECF3; --muted:#909CAC; --line:#232D39; --line-strong:#33404F;
      --accent:#5AA2F7; --accent-soft:#122539;
      --pass:#35B482; --pass-soft:#10281F;
      --fail:#F07268; --fail-soft:#2B1714;
      --warn:#DFA83C; --warn-soft:#2A2010;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0D1219; --surface:#151C25; --surface-2:#1C242F;
    --ink:#E6ECF3; --muted:#909CAC; --line:#232D39; --line-strong:#33404F;
    --accent:#5AA2F7; --accent-soft:#122539;
    --pass:#35B482; --pass-soft:#10281F;
    --fail:#F07268; --fail-soft:#2B1714;
    --warn:#DFA83C; --warn-soft:#2A2010;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0; line-height:1.3; font-weight:600; letter-spacing:-0.01em}
  button{font:inherit; color:inherit; cursor:pointer}
  a{color:var(--accent)}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:760px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:auto}
  .brand b{font-size:15px; font-weight:600; letter-spacing:-0.02em}
  .brand span{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.06em}
  .tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r); flex-wrap:wrap}
  .tabs button{
    border:0; background:transparent; padding:5px 11px; border-radius:7px;
    font-size:13px; color:var(--muted); font-weight:500;
  }
  .tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(15,23,42,.10)}
  .tabs button:hover:not([aria-selected="true"]){color:var(--ink)}

  /* ---------- 版心 ---------- */
  main{max-width:760px; margin:0 auto; padding:0 16px; padding-block:24px 72px}
  .stack{display:flex; flex-direction:column; gap:18px}
  .lead{color:var(--muted); font-size:14px; max-width:62ch}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px}
  .panel-tight{padding:16px}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .spread{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}

  .btn{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:9px 16px; border-radius:9px; font-size:14px; font-weight:500;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn-primary:hover{filter:brightness(1.08); color:#fff}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn-sm{padding:6px 12px; font-size:13px}

  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- 题卡 ---------- */
  .qmeta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .chip{
    font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
  }
  .chip-accent{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .qtext{font-size:17px; line-height:1.6; font-weight:500; margin-bottom:16px; text-wrap:pretty}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{
    display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
    border:1px solid var(--line); background:var(--surface); border-radius:var(--r);
    padding:11px 13px; font-size:14.5px; line-height:1.55; transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:var(--accent)}
  .opt .key{
    font-family:var(--mono); font-size:12px; font-weight:600; flex:none;
    width:22px; height:22px; border-radius:6px; display:grid; place-items:center;
    background:var(--surface-2); color:var(--muted); margin-top:1px;
  }
  .opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .opt[aria-pressed="true"] .key{background:var(--accent); color:#fff}
  .opt[data-mark="right"]{border-color:var(--pass); background:var(--pass-soft)}
  .opt[data-mark="right"] .key{background:var(--pass); color:#fff}
  .opt[data-mark="wrong"]{border-color:var(--fail); background:var(--fail-soft)}
  .opt[data-mark="wrong"] .key{background:var(--fail); color:#fff}
  .opt[disabled]{cursor:default}
  .opt[disabled]:hover{border-color:var(--line)}
  .opt[disabled][data-mark="right"]:hover{border-color:var(--pass)}
  .opt[disabled][data-mark="wrong"]:hover{border-color:var(--fail)}

  /* ---------- 讲评 ---------- */
  .feedback{display:flex; flex-direction:column; gap:14px; margin-top:18px}
  .verdict{display:flex; align-items:center; gap:9px; font-weight:600; font-size:15px}
  .verdict.ok{color:var(--pass)} .verdict.no{color:var(--fail)}
  .note{border-left:3px solid var(--line-strong); padding-left:13px}
  .note h4{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); margin:0 0 5px; font-weight:600;
  }
  .note p{margin:0; font-size:14px; line-height:1.7}
  .note-why{border-color:var(--fail)}
  .note-why h4{color:var(--fail)}
  .note-ref{border-color:var(--accent)}
  .note-ref h4{color:var(--accent)}
  .note-ref a{font-size:13px; word-break:break-all; font-family:var(--mono)}
  .wrong-opt{margin-bottom:9px}
  .wrong-opt:last-child{margin-bottom:0}
  .wrong-opt b{font-weight:600}

  /* ---------- 考试进度条 ---------- */
  .runbar{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 52px); z-index:10;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:9px 13px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .dots{display:flex; gap:3px; flex-wrap:wrap; flex:1; min-width:120px}
  .dot{width:7px; height:7px; border-radius:2px; background:var(--line-strong)}
  .dot.done{background:var(--accent)}
  .dot.now{background:var(--ink); outline:2px solid var(--accent-soft)}
  .timer{font-family:var(--mono); font-size:14px; font-weight:600}
  .timer.low{color:var(--fail)}

  /* ---------- 成绩 ---------- */
  .score-big{font-family:var(--mono); font-size:52px; font-weight:600; line-height:1; letter-spacing:-0.03em}
  .gauge{position:relative; height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; margin:14px 0 6px}
  .gauge i{position:absolute; inset:0 auto 0 0; border-radius:5px; display:block}
  .gauge-mark{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); opacity:.55}
  .gauge-legend{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted)}

  .bars{display:flex; flex-direction:column; gap:11px}
  .bar-row{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:baseline}
  .bar-label{font-size:13.5px}
  .bar-num{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
  .bar-track{grid-column:1/-1; height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden}
  .bar-fill{height:100%; border-radius:4px}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  th{font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:500}
  td.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .scroll-x{overflow-x:auto}

  /* ---------- 列表 ---------- */
  .wlist{display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r); overflow:hidden}
  .witem{background:var(--surface); padding:13px 15px; display:flex; flex-direction:column; gap:5px}
  .witem-head{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
  .witem-q{font-size:14px; line-height:1.5}
  .boxdots{font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:1px}

  .plan-day{border-left:3px solid var(--line-strong); padding:2px 0 2px 15px}
  .plan-day.today{border-color:var(--accent)}
  .plan-day h3{font-size:15.5px; margin-bottom:4px}
  .plan-focus{font-size:13.5px; color:var(--muted); margin:4px 0 9px}
  .plan-target{font-size:13px; color:var(--warn); background:var(--warn-soft); padding:5px 10px; border-radius:7px; display:inline-block}

  .empty{text-align:center; color:var(--muted); padding:34px 16px; font-size:14px}
  .kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
  .savenote{font-size:12px; color:var(--muted); font-family:var(--mono)}

  @media (max-width:520px){
    .score-big{font-size:42px}
    .topbar-inner{gap:9px}
    .brand span{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><b>AZ-900 五天冲刺</b><span id="bankCount">179 题</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main id="app"><div class="empty">载入题库…</div></main>

<script src="bank.js"></script>
<script>
(function(){
  "use strict";

  /* ============ 基础数据 ============ */
  var BANK = (window.AZ900_BANK || []).map(function(r){
    return {id:r.id, domain:r.d, topic:r.t, type:r.k, question:r.q, options:r.o,
            answer:r.a, explanation:r.e, reasons:r.r, refTitle:r.rt, refUrl:r.ru};
  });
  var BY_ID = {}; BANK.forEach(function(q){ BY_ID[q.id]=q; });

  var DOMAINS = {
    "cloud-concepts":        {no:1, cn:"云概念",          weight:0.275, official:"25–30%"},
    "architecture-services": {no:2, cn:"Azure 架构与服务", weight:0.375, official:"35–40%"},
    "management-governance": {no:3, cn:"Azure 管理与治理", weight:0.325, official:"30–35%"}
  };
  var DOM_KEYS = Object.keys(DOMAINS);
  var PASS = 700, MAXSCORE = 1000;
  var TYPE_CN = {single:"单选题", multi:"多选题", truefalse:"判断题"};
  var BOX_HOURS = {1:0, 2:3, 3:12, 4:24, 5:48};

  var PLAN = [
    {day:1, title:"云概念打底 + Azure 架构骨架",
     focus:"共享责任模型、云部署模型、消费模型与 CapEx/OpEx、云的优势、IaaS/PaaS/SaaS、区域与可用性区域、资源组织层级",
     tasks:[{label:"刷完领域 1（47 题）", go:{mode:"practice", domain:"cloud-concepts"}},
            {label:"练「区域与可用性区域」", go:{mode:"practice", topic:"核心架构：区域与可用性区域"}},
            {label:"练「资源组织层级」", go:{mode:"practice", topic:"核心架构：资源组织层级"}},
            {label:"20 题小测热身", go:{mode:"exam", count:20}}],
     target:"领域 1 正确率 ≥ 80%"},
    {day:2, title:"计算 + 网络（领域 2 的最大失分区）",
     focus:"虚拟机与规模集、可用性集、虚拟桌面、容器与 AKS、Functions、App Service、虚拟网络与子网、VPN 网关、ExpressRoute、专用终结点",
     tasks:[{label:"练所有「计算服务」题", go:{mode:"practice", topicLike:"计算服务"}},
            {label:"练所有「网络服务」题", go:{mode:"practice", topicLike:"网络服务"}},
            {label:"清昨天的错题", go:{mode:"wrong", review:true}},
            {label:"30 题模拟", go:{mode:"exam", count:30}}],
     target:"计算/网络类题目正确率 ≥ 75%"},
    {day:3, title:"存储 + 身份与安全",
     focus:"存储账户与冗余（LRS/ZRS/GRS/GZRS）、访问层、迁移工具、Entra ID、MFA 与条件访问、RBAC、零信任、纵深防御、Defender for Cloud",
     tasks:[{label:"练所有「存储服务」题", go:{mode:"practice", topicLike:"存储服务"}},
            {label:"练所有「身份与访问」题", go:{mode:"practice", topicLike:"身份与访问"}},
            {label:"练所有「安全」题", go:{mode:"practice", topicLike:"安全："}},
            {label:"错题复习", go:{mode:"wrong", review:true}},
            {label:"40 题模拟", go:{mode:"exam", count:40}}],
     target:"领域 2 整体 ≥ 75%，模拟考 ≥ 650 分"},
    {day:4, title:"管理与治理 + 第一次全真模拟",
     focus:"成本因素与优化、定价计算器 vs TCO、Cost Management 与预算、标记、Azure Policy 与资源锁、Purview、服务信任门户、门户/CLI/PowerShell/Cloud Shell、ARM 与 Bicep、Monitor / Advisor / Service Health",
     tasks:[{label:"刷完领域 3（60 题）", go:{mode:"practice", domain:"management-governance"}},
            {label:"错题复习", go:{mode:"wrong", review:true}},
            {label:"50 题 / 45 分钟全真模拟", go:{mode:"exam", count:50}}],
     target:"全真模拟 ≥ 700 分（首次达标）"},
    {day:5, title:"错题清零 + 两次全真模拟稳定达标",
     focus:"错题本全部攻克、三大领域均衡、考试节奏（平均每题 ≤ 54 秒）",
     tasks:[{label:"反复刷到错题本清空", go:{mode:"wrong", review:true}},
            {label:"第二次全真模拟", go:{mode:"exam", count:50}},
            {label:"第三次全真模拟", go:{mode:"exam", count:50}},
            {label:"看进度是否三领域都 ≥ 80%", go:{mode:"stats"}}],
     target:"连续两次模拟 ≥ 800 分，且错题本已攻克 ≥ 90%"}
  ];

  /* ============ 存储：优先用 db，退回浏览器本地 ============ */
  var DB = null, LOCAL_KEY = "az900-state-v1";
  var S = {wrong:{}, sessions:[], seen:{}, startedAt:0};

  function localLoad(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ var v = JSON.parse(raw); S.wrong=v.wrong||{}; S.sessions=v.sessions||[]; S.seen=v.seen||{}; S.startedAt=v.startedAt||0; }
    }catch(e){}
  }
  function localSave(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); }catch(e){}
  }

  async function loadState(){
    localLoad();
    try{ DB = await window.claude?.use?.("db"); }catch(e){ DB = null; }
    if(!DB) return;
    try{
      var seenSnap = await DB.doc("meta/seen").get();
      if(seenSnap.exists) S.seen = (seenSnap.data() || {}).map || S.seen;
      var wrongSnap = await DB.collection("wrong").get();
      if(wrongSnap.size){
        var w = {};
        wrongSnap.docs.forEach(function(d){ w[d.id] = d.data(); });
        S.wrong = w;
      }
      var sessSnap = await DB.collection("sessions").orderBy("at","desc").limit(60).get();
      if(sessSnap.size){
        S.sessions = sessSnap.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return a.at-b.at; });
      }
      var meta = await DB.doc("meta/profile").get();
      if(meta.exists) S.startedAt = (meta.data()||{}).startedAt || S.startedAt;
    }catch(e){ /* 读不到就用本地数据继续 */ }
    render();
  }

  // 一次会话结束后统一落盘，避免每题都写
  async function persist(session, touchedQids){
    localSave();
    if(!DB) return;
    try{
      await DB.doc("meta/seen").set({map:S.seen, updatedAt:Date.now()});
      if(!S.startedAt){ S.startedAt = Date.now(); }
      await DB.doc("meta/profile").set({startedAt:S.startedAt});
      if(session) await DB.collection("sessions").doc(session.id).set(session);
      for(var i=0;i<touchedQids.length;i++){
        var qid = touchedQids[i], entry = S.wrong[qid];
        if(entry){ await DB.doc("wrong/"+qid).set(entry); }
        else{ await DB.doc("wrong/"+qid).delete(); }
      }
    }catch(e){ /* 写失败不影响本地进度 */ }
  }

  /* ============ 错题本逻辑（Leitner 间隔重复） ============ */
  function markWrong(q, picked){
    var e = S.wrong[q.id];
    if(!e){
      e = {qid:q.id, domain:q.domain, topic:q.topic, wrongCount:0, rightStreak:0,
           box:1, firstWrongAt:Date.now(), mastered:false};
      S.wrong[q.id] = e;
    }
    e.wrongCount++; e.rightStreak = 0; e.box = 1; e.mastered = false;
    e.lastPicked = picked; e.answer = q.answer; e.dueAt = Date.now(); e.updatedAt = Date.now();
  }
  function markReview(q, picked, correct){
    var e = S.wrong[q.id]; if(!e) return;
    if(correct){
      e.rightStreak = (e.rightStreak||0) + 1;
      e.box = Math.min(5, (e.box||1) + 1);
      e.dueAt = Date.now() + BOX_HOURS[e.box]*3600e3;
      if(e.box >= 4 && e.rightStreak >= 2){ e.mastered = true; }
    }else{
      e.wrongCount++; e.rightStreak = 0; e.box = 1; e.mastered = false;
      e.dueAt = Date.now(); e.lastPicked = picked;
    }
    e.updatedAt = Date.now();
  }
  function wrongList(includeMastered){
    return Object.keys(S.wrong).map(function(k){ return S.wrong[k]; })
      .filter(function(e){ return includeMastered || !e.mastered; })
      .sort(function(a,b){ return (b.wrongCount||0)-(a.wrongCount||0) || (a.dueAt||0)-(b.dueAt||0); });
  }
  function dueList(){
    var now = Date.now();
    return wrongList(false).filter(function(e){ return (e.dueAt||0) <= now; });
  }

  /* ============ 组卷与评分 ============ */
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function buildExam(count){
    var picked = [], chosen = {};
    DOM_KEYS.forEach(function(k){
      var pool = shuffle(BANK.filter(function(q){ return q.domain===k; }));
      var want = Math.round(count * DOMAINS[k].weight);
      pool.slice(0, want).forEach(function(q){ picked.push(q); chosen[q.id]=1; });
    });
    if(picked.length < count){
      shuffle(BANK.filter(function(q){ return !chosen[q.id]; }))
        .slice(0, count - picked.length).forEach(function(q){ picked.push(q); });
    }
    return shuffle(picked).slice(0, count);
  }
  function scaled(correct, total){ return total ? Math.round(correct/total*MAXSCORE) : 0; }
  function sameSet(a, b){
    if(a.length !== b.length) return false;
    var s = a.slice().sort().join(""), t = b.slice().sort().join("");
    return s === t;
  }

  /* ============ 视图状态 ============ */
  var view = {mode:"plan"};
  var run = null; // 当前答题会话

  var TABS = [
    {id:"plan",     label:"计划"},
    {id:"exam",     label:"模拟考"},
    {id:"practice", label:"专项练习"},
    {id:"wrong",    label:"错题本"},
    {id:"stats",    label:"进度"}
  ];

  var app = document.getElementById("app");
  var tabsEl = document.getElementById("tabs");
  document.getElementById("bankCount").textContent = BANK.length + " 题";

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  function renderTabs(){
    tabsEl.innerHTML = "";
    TABS.forEach(function(t){
      var b = el("button", null, t.label);
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", view.mode===t.id ? "true" : "false");
      b.onclick = function(){
        if(run && !confirm("离开会中断当前这套题，已作答的部分不会计分。确定离开？")) return;
        run = null; view = {mode:t.id}; render();
      };
      tabsEl.appendChild(b);
    });
  }

  function go(cfg){
    if(cfg.mode === "exam"){ startExam(cfg.count || 50); return; }
    if(cfg.mode === "practice"){
      var pool = BANK.filter(function(q){
        if(cfg.domain && q.domain !== cfg.domain) return false;
        if(cfg.topic && q.topic !== cfg.topic) return false;
        if(cfg.topicLike && q.topic.indexOf(cfg.topicLike) === -1) return false;
        return true;
      });
      startPractice(pool, cfg.label || "专项练习");
      return;
    }
    if(cfg.mode === "wrong" && cfg.review){ startReview(); return; }
    view = {mode: cfg.mode}; render();
  }

  /* ============ 答题会话 ============ */
  function startRun(kind, questions, opts){
    if(!questions.length){ alert("没有符合条件的题目。"); return; }
    run = {
      kind: kind, questions: questions, idx: 0, picked: [], submitted: false,
      answers: {}, startedAt: Date.now(), label: (opts && opts.label) || "",
      limitMs: (opts && opts.limitMin) ? opts.limitMin*60000 : 0,
      instant: kind !== "exam", touched: {}
    };
    view = {mode: kind === "exam" ? "exam" : (kind === "review" ? "wrong" : "practice")};
    render();
    if(run.limitMs) tickTimer();
  }
  function startExam(count){
    var n = Math.min(count, BANK.length);
    startRun("exam", buildExam(n), {limitMin: Math.max(5, Math.round(n*0.9)), label:"全真模拟考"});
  }
  function startPractice(pool, label){
    startRun("practice", shuffle(pool.slice()), {label: label});
  }
  function startReview(){
    var due = dueList(), all = wrongList(false);
    var src = due.length ? due : all;
    if(!src.length){ alert("错题本是空的，先去做一套模拟考。"); return; }
    var qs = src.map(function(e){ return BY_ID[e.qid]; }).filter(Boolean);
    startRun("review", shuffle(qs), {label: due.length ? "到期错题复习" : "错题复习"});
  }

  var timerHandle = null;
  function tickTimer(){
    clearInterval(timerHandle);
    timerHandle = setInterval(function(){
      if(!run || !run.limitMs){ clearInterval(timerHandle); return; }
      var left = run.limitMs - (Date.now() - run.startedAt);
      var t = document.getElementById("timer");
      if(t){
        var s = Math.max(0, Math.floor(left/1000));
        t.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
        t.classList.toggle("low", left < 5*60000);
      }
      if(left <= 0){ clearInterval(timerHandle); finishRun(true); }
    }, 500);
  }

  function toggleOpt(key){
    if(!run || run.submitted) return;
    var q = run.questions[run.idx];
    if(q.type === "multi"){
      var i = run.picked.indexOf(key);
      if(i >= 0) run.picked.splice(i,1); else run.picked.push(key);
    }else{
      run.picked = [key];
    }
    render();
  }

  function submitCurrent(){
    if(!run || run.submitted || !run.picked.length) return;
    var q = run.questions[run.idx];
    var correct = sameSet(run.picked, q.answer);
    run.answers[q.id] = {picked: run.picked.slice(), correct: correct};

    var st = S.seen[q.id] || [0,0];
    st[0]++; if(correct) st[1]++;
    S.seen[q.id] = st;

    if(run.kind === "review"){ markReview(q, run.picked.slice(), correct); run.touched[q.id]=1; }
    else if(!correct){ markWrong(q, run.picked.slice()); run.touched[q.id]=1; }

    if(run.instant){ run.submitted = true; render(); }
    else{ nextQuestion(); }
  }

  function nextQuestion(){
    if(!run) return;
    run.submitted = false; run.picked = [];
    if(run.idx + 1 >= run.questions.length){ finishRun(false); return; }
    run.idx++; render();
    window.scrollTo({top:0, behavior:"instant"});
  }

  function finishRun(timedOut){
    clearInterval(timerHandle);
    if(!run) return;
    var total = run.questions.length;
    var correct = 0;
    run.questions.forEach(function(q){ if(run.answers[q.id] && run.answers[q.id].correct) correct++; });

    var dom = {};
    DOM_KEYS.forEach(function(k){ dom[k] = [0,0]; });
    run.questions.forEach(function(q){
      dom[q.domain][1]++;
      if(run.answers[q.id] && run.answers[q.id].correct) dom[q.domain][0]++;
    });

    var session = {
      id: "s" + Date.now(), kind: run.kind, at: Date.now(), total: total, correct: correct,
      score: scaled(correct, total), elapsedSec: Math.round((Date.now()-run.startedAt)/1000),
      timedOut: !!timedOut, dom: dom, label: run.label,
      qids: run.questions.map(function(q){ return q.id; })
    };
    S.sessions.push(session);
    if(!S.startedAt) S.startedAt = Date.now();

    var result = {session: session, questions: run.questions, answers: run.answers, kind: run.kind};
    var touched = Object.keys(run.touched);
    run = null;
    view = {mode: "result", result: result};
    render();
    persist(session, touched);
  }

  /* ============ 渲染 ============ */
  function render(){
    renderTabs();
    app.innerHTML = "";
    if(run){ renderRun(); return; }
    if(view.mode === "result"){ renderResult(view.result); return; }
    ({plan:renderPlan, exam:renderExamHome, practice:renderPracticeHome,
      wrong:renderWrong, stats:renderStats}[view.mode] || renderPlan)();
  }

  function renderRun(){
    var q = run.questions[run.idx], wrap = el("div","stack");

    // 进度条
    var bar = el("div","runbar");
    var dots = el("div","dots");
    run.questions.forEach(function(qq, i){
      var d = el("span","dot");
      if(run.answers[qq.id]) d.className += " done";
      if(i === run.idx) d.className += " now";
      dots.appendChild(d);
    });
    bar.appendChild(dots);
    var cnt = el("span","timer", (run.idx+1) + " / " + run.questions.length);
    bar.appendChild(cnt);
    if(run.limitMs){
      var t = el("span","timer"); t.id = "timer";
      var left = Math.max(0, Math.floor((run.limitMs - (Date.now()-run.startedAt))/1000));
      t.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0");
      bar.appendChild(t);
    }
    wrap.appendChild(bar);

    // 题卡
    var card = el("div","panel");
    var meta = el("div","qmeta");
    meta.appendChild(el("span","chip", q.id));
    meta.appendChild(el("span","chip chip-accent", "领域" + DOMAINS[q.domain].no + " · " + q.topic));
    meta.appendChild(el("span","chip", TYPE_CN[q.type]));
    if(run.kind === "exam") meta.appendChild(el("span","chip","考试中不显示答案"));
    card.appendChild(meta);
    card.appendChild(el("div","qtext", q.question));

    var opts = el("div","opts");
    Object.keys(q.options).sort().forEach(function(k){
      var b = el("button","opt");
      b.setAttribute("aria-pressed", run.picked.indexOf(k) >= 0 ? "true" : "false");
      b.appendChild(el("span","key", k));
      b.appendChild(el("span",null, q.options[k]));
      if(run.submitted){
        b.disabled = true;
        if(q.answer.indexOf(k) >= 0) b.dataset.mark = "right";
        else if(run.picked.indexOf(k) >= 0) b.dataset.mark = "wrong";
      }else{
        b.onclick = function(){ toggleOpt(k); };
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.type === "multi" && !run.submitted){
      var hint = el("p","lead", "多选题：本题需要选 " + q.answer.length + " 项。");
      hint.style.marginTop = "10px"; hint.style.marginBottom = "0";
      card.appendChild(hint);
    }

    if(run.submitted){
      card.appendChild(feedbackBlock(q, run.answers[q.id].picked, run.answers[q.id].correct));
    }

    var actions = el("div","row"); actions.style.marginTop = "18px";
    if(run.submitted){
      var nx = el("button","btn btn-primary",
        run.idx + 1 >= run.questions.length ? "交卷看成绩" : "下一题");
      nx.onclick = nextQuestion;
      actions.appendChild(nx);
    }else{
      var sb = el("button","btn btn-primary", run.kind === "exam" ? "确定并进入下一题" : "提交答案");
      sb.disabled = !run.picked.length;
      sb.onclick = submitCurrent;
      actions.appendChild(sb);
      var sk = el("button","btn","跳过");
      sk.onclick = function(){
        var qq = run.questions[run.idx];
        if(!run.answers[qq.id]){
          run.answers[qq.id] = {picked:[], correct:false};
          var st = S.seen[qq.id] || [0,0]; st[0]++; S.seen[qq.id] = st;
          if(run.kind === "review"){ markReview(qq, [], false); }
          else { markWrong(qq, []); }
          run.touched[qq.id] = 1;
        }
        nextQuestion();
      };
      actions.appendChild(sk);
      if(run.kind === "exam"){
        var fin = el("button","btn","提前交卷");
        fin.onclick = function(){ if(confirm("提前交卷？未作答的题按错误计分。")) finishRun(false); };
        actions.appendChild(fin);
      }
    }
    card.appendChild(actions);
    wrap.appendChild(card);
    app.appendChild(wrap);
  }

  function feedbackBlock(q, picked, correct){
    var fb = el("div","feedback");
    var v = el("div","verdict " + (correct ? "ok" : "no"));
    v.appendChild(el("span",null, correct ? "✓" : "✕"));
    v.appendChild(el("span",null, correct ? "回答正确" : "回答错误"));
    fb.appendChild(v);

    if(!correct){
      var you = el("p","lead");
      you.style.margin = "0";
      you.textContent = "你选了 " + (picked.join("、") || "（未作答）") + "，正确答案是 " + q.answer.join("、") + "。";
      fb.appendChild(you);
    }

    var ex = el("div","note");
    ex.appendChild(el("h4",null,"解析"));
    ex.appendChild(el("p",null, q.explanation));
    fb.appendChild(ex);

    var wrongKeys = picked.filter(function(k){ return q.answer.indexOf(k) === -1; });
    if(wrongKeys.length){
      var why = el("div","note note-why");
      why.appendChild(el("h4",null,"你选的为什么错"));
      wrongKeys.forEach(function(k){
        var row = el("div","wrong-opt");
        var b = el("b",null, k + ". " + q.options[k]);
        row.appendChild(b);
        row.appendChild(el("p",null, q.reasons[k] || "该选项与题干要求的场景不符。"));
        why.appendChild(row);
      });
      fb.appendChild(why);
    }

    var missed = q.answer.filter(function(k){ return picked.indexOf(k) === -1; });
    if(missed.length && q.type === "multi" && picked.length){
      var miss = el("div","note");
      miss.appendChild(el("h4",null,"你漏掉的正确项"));
      missed.forEach(function(k){
        miss.appendChild(el("p",null, k + ". " + q.options[k]));
      });
      fb.appendChild(miss);
    }

    var ref = el("div","note note-ref");
    ref.appendChild(el("h4",null,"官方出处"));
    var p = el("p",null, q.refTitle + " ");
    var a = el("a",null, q.refUrl);
    a.href = q.refUrl; a.target = "_blank"; a.rel = "noopener";
    p.appendChild(document.createElement("br")); p.appendChild(a);
    ref.appendChild(p);
    fb.appendChild(ref);
    return fb;
  }

  /* ---------- 成绩单 ---------- */
  function renderResult(res){
    var s = res.session, wrap = el("div","stack");
    var pass = s.score >= PASS;

    var head = el("div","panel");
    head.appendChild(el("div","eyebrow", (s.kind==="exam"?"全真模拟考":(s.kind==="review"?"错题复习":"专项练习")) + " · 成绩单"));
    var big = el("div","score-big", String(s.score));
    big.style.color = pass ? "var(--pass)" : "var(--fail)";
    head.appendChild(big);
    var verdictLine = el("div", null);
    verdictLine.style.fontWeight = "600";
    verdictLine.style.color = pass ? "var(--pass)" : "var(--fail)";
    verdictLine.textContent = pass ? "达标（及格线 700）" : "未达标，及格线 700";
    head.appendChild(verdictLine);

    var g = el("div","gauge");
    var fill = el("i"); fill.style.width = Math.min(100, s.score/MAXSCORE*100) + "%";
    fill.style.background = pass ? "var(--pass)" : "var(--fail)";
    g.appendChild(fill);
    var mark = el("span","gauge-mark"); mark.style.left = (PASS/MAXSCORE*100) + "%";
    g.appendChild(mark);
    head.appendChild(g);
    var lg = el("div","gauge-legend");
    lg.appendChild(el("span",null,"0"));
    lg.appendChild(el("span",null,"700 及格线"));
    lg.appendChild(el("span",null,"1000"));
    head.appendChild(lg);

    var sub = el("p","lead");
    sub.style.marginTop = "12px";
    sub.textContent = "答对 " + s.correct + "/" + s.total + " 题，用时 " +
      Math.floor(s.elapsedSec/60) + " 分 " + (s.elapsedSec%60) + " 秒" +
      (s.total ? "，平均每题 " + Math.round(s.elapsedSec/s.total) + " 秒" : "") +
      (s.timedOut ? "（时间到，未作答按错误计分）" : "");
    head.appendChild(sub);
    wrap.appendChild(head);

    // 领域得分
    var dp = el("div","panel");
    dp.appendChild(el("div","eyebrow","各领域得分"));
    var bars = el("div","bars"); bars.style.marginTop = "12px";
    DOM_KEYS.forEach(function(k){
      var d = s.dom[k]; if(!d || !d[1]) return;
      var rate = d[0]/d[1];
      var row = el("div","bar-row");
      row.appendChild(el("div","bar-label","领域" + DOMAINS[k].no + " " + DOMAINS[k].cn));
      row.appendChild(el("div","bar-num", d[0] + "/" + d[1] + "  " + Math.round(rate*100) + "%"));
      var track = el("div","bar-track");
      var f = el("div","bar-fill");
      f.style.width = (rate*100) + "%";
      f.style.background = rate>=0.8 ? "var(--pass)" : (rate>=0.6 ? "var(--warn)" : "var(--fail)");
      track.appendChild(f); row.appendChild(track);
      bars.appendChild(row);
    });
    dp.appendChild(bars);
    wrap.appendChild(dp);

    // 错题讲评
    var wrongQs = res.questions.filter(function(q){
      var a = res.answers[q.id]; return !a || !a.correct;
    });
    if(wrongQs.length){
      var wp = el("div","panel");
      wp.appendChild(el("div","eyebrow","逐题讲评 · " + wrongQs.length + " 道错题（已收入错题本）"));
      wrongQs.forEach(function(q, i){
        var a = res.answers[q.id] || {picked:[]};
        var block = el("div");
        block.style.paddingTop = "18px";
        block.style.marginTop = i ? "18px" : "10px";
        if(i) block.style.borderTop = "1px solid var(--line)";
        var m = el("div","qmeta");
        m.appendChild(el("span","chip", q.id));
        m.appendChild(el("span","chip chip-accent", q.topic));
        block.appendChild(m);
        block.appendChild(el("div","qtext", q.question));
        var ol = el("div","opts");
        Object.keys(q.options).sort().forEach(function(k){
          var b = el("div","opt"); b.style.cursor = "default";
          b.appendChild(el("span","key", k));
          b.appendChild(el("span",null, q.options[k]));
          if(q.answer.indexOf(k) >= 0) b.dataset.mark = "right";
          else if(a.picked.indexOf(k) >= 0) b.dataset.mark = "wrong";
          ol.appendChild(b);
        });
        block.appendChild(ol);
        block.appendChild(feedbackBlock(q, a.picked, false));
        wp.appendChild(block);
      });
      wrap.appendChild(wp);
    }else{
      var ok = el("div","panel");
      ok.appendChild(el("div","empty","全对。这套题没有留下错题。"));
      wrap.appendChild(ok);
    }

    var act = el("div","row");
    var left = wrongList(false).length;
    if(left){
      var rv = el("button","btn btn-primary","去复习错题（还剩 " + left + " 题）");
      rv.onclick = startReview;
      act.appendChild(rv);
    }
    var again = el("button","btn", s.kind === "exam" ? "再来一套模拟考" : "再练一组");
    again.onclick = function(){ if(s.kind === "exam") startExam(s.total); else { view={mode:"practice"}; render(); } };
    act.appendChild(again);
    var st = el("button","btn","看进度");
    st.onclick = function(){ view = {mode:"stats"}; render(); };
    act.appendChild(st);
    wrap.appendChild(act);

    app.appendChild(wrap);
    window.scrollTo({top:0, behavior:"instant"});
  }

  function currentDay(){
    if(!S.startedAt) return 1;
    var d = Math.floor((Date.now() - S.startedAt) / 86400000) + 1;
    return Math.min(5, Math.max(1, d));
  }

  function examTable(exams){
    var sc = el("div","scroll-x");
    var t = el("table");
    var thead = el("thead");
    var tr = el("tr");
    ["#","时间","题数","答对","得分","结果"].forEach(function(h){ tr.appendChild(el("th",null,h)); });
    thead.appendChild(tr); t.appendChild(thead);
    var tb = el("tbody");
    exams.slice(-12).forEach(function(s, i){
      var r = el("tr");
      r.appendChild(el("td","num", String(exams.length - Math.min(exams.length,12) + i + 1)));
      r.appendChild(el("td","num", new Date(s.at).toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"}) +
        " " + new Date(s.at).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})));
      r.appendChild(el("td","num", String(s.total)));
      r.appendChild(el("td","num", String(s.correct)));
      var sd = el("td","num", String(s.score));
      sd.style.fontWeight = "600";
      sd.style.color = s.score >= PASS ? "var(--pass)" : "var(--fail)";
      r.appendChild(sd);
      var vd = el("td",null, s.score >= PASS ? "达标" : "未达标");
      vd.style.color = s.score >= PASS ? "var(--pass)" : "var(--fail)";
      r.appendChild(vd);
      tb.appendChild(r);
    });
    t.appendChild(tb); sc.appendChild(t);
    return sc;
  }

  /* ---------- 专项练习 ---------- */
  function renderPracticeHome(){
    var wrap = el("div","stack");
    var p = el("div","panel");
    p.appendChild(el("div","eyebrow","专项练习"));
    var h = el("h2",null,"按领域或考点刷，答一题讲一题");
    h.style.margin = "6px 0 10px"; h.style.fontSize = "20px";
    p.appendChild(h);
    p.appendChild(el("p","lead","专项练习会立刻给出解析和出处，适合打基础和补弱项。答错同样自动进错题本。"));

    var row = el("div","row"); row.style.marginTop = "14px";
    DOM_KEYS.forEach(function(k){
      var n = BANK.filter(function(q){ return q.domain===k; }).length;
      var b = el("button","btn","领域" + DOMAINS[k].no + " " + DOMAINS[k].cn + "（" + n + " 题）");
      b.onclick = function(){ go({mode:"practice", domain:k, label:"领域" + DOMAINS[k].no}); };
      row.appendChild(b);
    });
    var nb = el("button","btn btn-primary","只练没做过的（" + unseenCount() + " 题）");
    nb.onclick = function(){
      var pool = BANK.filter(function(q){ return !S.seen[q.id]; });
      if(!pool.length){ alert("题库已经全部练过一遍了。去做模拟考或复习错题吧。"); return; }
      startPractice(pool, "未做过的题");
    };
    row.appendChild(nb);
    p.appendChild(row);
    wrap.appendChild(p);

    // 按考点
    var tp = el("div","panel");
    tp.appendChild(el("div","eyebrow","按考点"));
    DOM_KEYS.forEach(function(k){
      var seen = {}, topics = [];
      BANK.forEach(function(q){ if(q.domain===k && !seen[q.topic]){ seen[q.topic]=1; topics.push(q.topic); } });
      var hd = el("div","bar-label");
      hd.style.margin = "16px 0 8px"; hd.style.fontWeight = "600";
      hd.textContent = "领域" + DOMAINS[k].no + " " + DOMAINS[k].cn + " · 官方权重 " + DOMAINS[k].official;
      tp.appendChild(hd);
      var row2 = el("div","row");
      topics.forEach(function(t){
        var qs = BANK.filter(function(q){ return q.topic === t; });
        var acc = topicAccuracy(t);
        var b = el("button","btn btn-sm", t + "（" + qs.length + (acc === null ? "" : " · " + acc + "%") + "）");
        if(acc !== null && acc < 70){ b.style.borderColor = "var(--fail)"; b.style.color = "var(--fail)"; }
        b.onclick = function(){ go({mode:"practice", topic:t, label:t}); };
        row2.appendChild(b);
      });
      tp.appendChild(row2);
    });
    wrap.appendChild(tp);
    app.appendChild(wrap);
  }

  function unseenCount(){
    return BANK.filter(function(q){ return !S.seen[q.id]; }).length;
  }
  function topicAccuracy(topic){
    var a = 0, r = 0;
    BANK.forEach(function(q){
      if(q.topic !== topic) return;
      var st = S.seen[q.id]; if(!st) return;
      a += st[0]; r += st[1];
    });
    return a ? Math.round(r/a*100) : null;
  }

  /* ---------- 错题本 ---------- */
  function renderWrong(){
    var wrap = el("div","stack");
    var all = wrongList(true);
    var pending = all.filter(function(e){ return !e.mastered; });
    var mastered = all.length - pending.length;
    var due = dueList();

    var p = el("div","panel");
    p.appendChild(el("div","eyebrow","错题本"));
    var h = el("h2",null, all.length ? (pending.length + " 题待攻克 · " + mastered + " 题已攻克") : "还没有错题");
    h.style.margin = "6px 0 10px"; h.style.fontSize = "20px";
    p.appendChild(h);
    p.appendChild(el("p","lead",
      "答对一次掌握度升一级并推迟下次出现（3 小时 → 12 小时 → 1 天 → 2 天），答错立刻打回 1 级。" +
      "掌握度到 4 级且连续答对 2 次才算攻克。"));
    var row = el("div","row"); row.style.marginTop = "14px";
    if(pending.length){
      var rb = el("button","btn btn-primary", due.length ? ("复习到期的 " + due.length + " 题") : ("复习全部 " + pending.length + " 题"));
      rb.onclick = startReview;
      row.appendChild(rb);
    }
    if(all.length){
      var cb = el("button","btn","清空错题本");
      cb.onclick = function(){
        if(!confirm("确定清空错题本？这会删掉所有错题记录和掌握度。")) return;
        var ids = Object.keys(S.wrong);
        S.wrong = {};
        persist(null, ids);
        render();
      };
      row.appendChild(cb);
    }
    p.appendChild(row);
    wrap.appendChild(p);

    if(!all.length){
      var e = el("div","panel");
      e.appendChild(el("div","empty","做一套模拟考，错的题会自动收录到这里，并标出你为什么错。"));
      wrap.appendChild(e);
      app.appendChild(wrap); return;
    }

    // 薄弱考点汇总
    var weak = {};
    pending.forEach(function(e){ weak[e.topic] = (weak[e.topic]||0) + (e.wrongCount||1); });
    var weakRows = Object.keys(weak).map(function(t){ return [t, weak[t]]; })
      .sort(function(a,b){ return b[1]-a[1]; }).slice(0,6);
    if(weakRows.length){
      var wp = el("div","panel panel-tight");
      wp.appendChild(el("div","eyebrow","最薄弱的考点"));
      var r = el("div","row"); r.style.marginTop = "10px";
      weakRows.forEach(function(x){
        var b = el("button","btn btn-sm", x[0] + " · 错 " + x[1] + " 次");
        b.onclick = function(){ go({mode:"practice", topic:x[0], label:x[0]}); };
        r.appendChild(b);
      });
      wp.appendChild(r);
      wrap.appendChild(wp);
    }

    var list = el("div","wlist");
    all.forEach(function(e){
      var q = BY_ID[e.qid]; if(!q) return;
      var it = el("div","witem");
      var hd = el("div","witem-head");
      hd.appendChild(el("span","chip", q.id));
      hd.appendChild(el("span","chip chip-accent", q.topic));
      var st = el("span","chip", e.mastered ? "已攻克" : ("错 " + e.wrongCount + " 次"));
      st.style.color = e.mastered ? "var(--pass)" : "var(--fail)";
      hd.appendChild(st);
      var box = e.box || 1;
      hd.appendChild(el("span","boxdots", "●".repeat(box) + "○".repeat(5-box)));
      it.appendChild(hd);
      it.appendChild(el("div","witem-q", q.question));
      var ans = el("div","lead");
      ans.style.fontSize = "13px"; ans.style.margin = "0";
      ans.textContent = "正确答案 " + q.answer.join("、") +
        "　你曾选 " + ((e.lastPicked && e.lastPicked.length) ? e.lastPicked.join("、") : "—");
      it.appendChild(ans);
      var det = el("details");
      var sum = el("summary","lead");
      sum.style.fontSize = "13px"; sum.style.cursor = "pointer"; sum.style.margin = "0";
      sum.textContent = "看解析和出处";
      det.appendChild(sum);
      var body = el("div");
      body.style.marginTop = "8px";
      body.appendChild(feedbackBlock(q, e.lastPicked || [], false));
      det.appendChild(body);
      it.appendChild(det);
      list.appendChild(it);
    });
    wrap.appendChild(list);
    app.appendChild(wrap);
  }

  /* ---------- 进度 ---------- */
  function renderStats(){
    var wrap = el("div","stack");
    var exams = S.sessions.filter(function(s){ return s.kind === "exam"; });
    var seenIds = Object.keys(S.seen);
    var attempts = 0, rights = 0;
    seenIds.forEach(function(k){ attempts += S.seen[k][0]; rights += S.seen[k][1]; });

    // 达标判断
    var last2 = exams.slice(-2).map(function(s){ return s.score; });
    var best = exams.length ? Math.max.apply(null, exams.map(function(s){ return s.score; })) : 0;
    var perDom = {};
    DOM_KEYS.forEach(function(k){ perDom[k] = [0,0]; });
    seenIds.forEach(function(id){
      var q = BY_ID[id]; if(!q) return;
      perDom[q.domain][0] += S.seen[id][1];
      perDom[q.domain][1] += S.seen[id][0];
    });
    var domOk = DOM_KEYS.every(function(k){
      var d = perDom[k]; return d[1] >= 15 && d[0]/d[1] >= 0.8;
    });
    var pending = wrongList(false).length;
    var ready = last2.length === 2 && last2[0] >= 800 && last2[1] >= 800 && domOk && pending === 0;

    var p = el("div","panel");
    p.appendChild(el("div","eyebrow","上考场准备度"));
    var verdict = el("h2",null, ready ? "可以约考了" : (best >= PASS ? "及格过，但还不稳" : "还没到及格线"));
    verdict.style.margin = "6px 0 10px"; verdict.style.fontSize = "22px";
    verdict.style.color = ready ? "var(--pass)" : (best >= PASS ? "var(--warn)" : "var(--fail)");
    p.appendChild(verdict);
    var checks = [
      ["连续两次模拟 ≥ 800 分", last2.length === 2 && last2[0] >= 800 && last2[1] >= 800,
       exams.length ? ("最近两次 " + last2.join(" / ") + " 分") : "还没做过模拟考"],
      ["三个领域正确率都 ≥ 80%", domOk, DOM_KEYS.map(function(k){
        var d = perDom[k]; return "领域" + DOMAINS[k].no + " " + (d[1] ? Math.round(d[0]/d[1]*100) + "%" : "未练");
      }).join("　")],
      ["错题本清空", pending === 0, pending ? ("还剩 " + pending + " 题待攻克") : "已全部攻克"],
      ["题库覆盖 ≥ 90%", seenIds.length/BANK.length >= 0.9,
       seenIds.length + "/" + BANK.length + " 题（" + Math.round(seenIds.length/BANK.length*100) + "%）"]
    ];
    var cl = el("div","bars"); cl.style.marginTop = "6px";
    checks.forEach(function(c){
      var r = el("div","bar-row");
      var lab = el("div","bar-label", (c[1] ? "✓ " : "○ ") + c[0]);
      lab.style.color = c[1] ? "var(--pass)" : "var(--muted)";
      r.appendChild(lab);
      r.appendChild(el("div","bar-num", c[2]));
      cl.appendChild(r);
    });
    p.appendChild(cl);
    var nextStep = el("p","lead"); nextStep.style.marginTop = "14px";
    nextStep.textContent = ready
      ? "四项都满足了。保持手感即可，考前一天再刷一套 50 题就够。"
      : (pending ? "下一步：先把错题本清空（还剩 " + pending + " 题），再做模拟考。"
                 : (exams.length ? "下一步：再做一套 50 题全真模拟。" : "下一步：先做一套 50 题全真模拟摸底。"));
    p.appendChild(nextStep);
    wrap.appendChild(p);

    // 领域正确率
    var dp = el("div","panel");
    dp.appendChild(el("div","eyebrow","各领域累计正确率"));
    var bars = el("div","bars"); bars.style.marginTop = "12px";
    DOM_KEYS.forEach(function(k){
      var d = perDom[k], rate = d[1] ? d[0]/d[1] : 0;
      var row = el("div","bar-row");
      row.appendChild(el("div","bar-label","领域" + DOMAINS[k].no + " " + DOMAINS[k].cn +
        "　官方权重 " + DOMAINS[k].official));
      row.appendChild(el("div","bar-num", d[1] ? (d[0] + "/" + d[1] + "  " + Math.round(rate*100) + "%") : "未练"));
      var track = el("div","bar-track");
      var f = el("div","bar-fill");
      f.style.width = (rate*100) + "%";
      f.style.background = rate >= 0.8 ? "var(--pass)" : (rate >= 0.6 ? "var(--warn)" : "var(--fail)");
      track.appendChild(f); row.appendChild(track);
      bars.appendChild(row);
    });
    dp.appendChild(bars);
    var cov = el("p","lead"); cov.style.marginTop = "14px";
    cov.textContent = "题库 " + BANK.length + " 题，已练过 " + seenIds.length + " 题" +
      (attempts ? "，累计作答 " + attempts + " 次，总正确率 " + Math.round(rights/attempts*100) + "%" : "");
    dp.appendChild(cov);
    wrap.appendChild(dp);

    // 最该补的考点
    var topicRows = [];
    var tAgg = {};
    seenIds.forEach(function(id){
      var q = BY_ID[id]; if(!q) return;
      var r = tAgg[q.topic] || [0,0];
      r[0] += S.seen[id][1]; r[1] += S.seen[id][0];
      tAgg[q.topic] = r;
    });
    Object.keys(tAgg).forEach(function(t){
      var r = tAgg[t];
      if(r[1] >= 3) topicRows.push([t, r[0]/r[1], r[0], r[1]]);
    });
    topicRows.sort(function(a,b){ return a[1]-b[1]; });
    if(topicRows.length){
      var tp = el("div","panel");
      tp.appendChild(el("div","eyebrow","最该补的考点"));
      var tb = el("div","bars"); tb.style.marginTop = "12px";
      topicRows.slice(0,8).forEach(function(r){
        var row = el("div","bar-row");
        var b = el("button","bar-label", r[0]);
        b.style.background = "none"; b.style.border = "0"; b.style.padding = "0";
        b.style.textAlign = "left"; b.style.textDecoration = "underline";
        b.style.textDecorationColor = "var(--line-strong)";
        b.onclick = function(){ go({mode:"practice", topic:r[0], label:r[0]}); };
        row.appendChild(b);
        row.appendChild(el("div","bar-num", r[2] + "/" + r[3] + "  " + Math.round(r[1]*100) + "%"));
        var track = el("div","bar-track");
        var f = el("div","bar-fill");
        f.style.width = (r[1]*100) + "%";
        f.style.background = r[1] >= 0.8 ? "var(--pass)" : (r[1] >= 0.6 ? "var(--warn)" : "var(--fail)");
        track.appendChild(f); row.appendChild(track);
        tb.appendChild(row);
      });
      tp.appendChild(tb);
      tp.appendChild(el("p","lead","点考点名可以直接练这一组。"));
      wrap.appendChild(tp);
    }

    if(exams.length){
      var hp = el("div","panel");
      hp.appendChild(el("div","eyebrow","历次模拟考"));
      hp.appendChild(examTable(exams));
      wrap.appendChild(hp);
    }

    var save = el("p","savenote");
    save.textContent = DB ? "进度已同步保存。" : "进度保存在这台设备的浏览器里。";
    wrap.appendChild(save);
    app.appendChild(wrap);
  }

  /* ============ 键盘快捷键 ============ */
  document.addEventListener("keydown", function(ev){
    if(!run) return;
    if(ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
    var q = run.questions[run.idx];
    var k = ev.key.toUpperCase();
    if(q.options[k] && !run.submitted){ ev.preventDefault(); toggleOpt(k); return; }
    if(ev.key === "Enter"){
      ev.preventDefault();
      if(run.submitted) nextQuestion(); else submitCurrent();
    }
  });

  /* ============ 启动 ============ */
  render();
  loadState();
})();
</script>
